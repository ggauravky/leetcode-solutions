name: Update Documentation and Solution Indexes

on:
  push:
    branches:
      - main
    paths:
      - 'LeetCode/**'
      - 'CodeChef/**'
      - 'scripts/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run README and table update script
        run: |
          python scripts/update_readmes.py

      - name: Commit and push if documentation updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md LeetCode/README.md CodeChef/README.md scripts/problem_metadata.json
          if git diff --staged --quiet; then
            echo "No documentation changes required. Everything is up to date."
          else
            git commit -m "docs: auto-update problem tables and statistics [skip ci]"
            git push
          fi
